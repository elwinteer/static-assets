<!doctype html><html><head><meta charset="utf-8"><style>
:root{--a:__A__;--a2:__A2__;--rgb:__RGB__;--on:__ON__;--mut:#a9a9b3;--line:rgba(255,255,255,.1);--sp:#1ed760;--sprg:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;color:#f4f4f7;user-select:none}
button{font-family:inherit;color:inherit}

@keyframes tst{0%{opacity:0;transform:translate(-50%,10px)}12%,86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
.bye #dock{transition:transform .26s cubic-bezier(.5,0,.8,.4),opacity .22s;transform:translate(-50%,70px)!important;opacity:0}.bye #card{transition:transform .22s,opacity .2s;transform:translateY(24px) scale(.95);opacity:0}.bye #top{transition:transform .24s,opacity .2s;transform:translateY(-24px);opacity:0}.bye .bd{transition:opacity .25s;opacity:0}.bye #hint{opacity:0;transition:opacity .15s}
.bd{position:fixed;inset:0;background:linear-gradient(0deg,rgba(5,5,8,.78),rgba(5,5,8,.38) 38%,rgba(5,5,8,.14) 70%);animation:bi .3s both}
.gl{background:linear-gradient(160deg,rgba(34,34,38,.9),rgba(14,14,17,.94));border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 90px rgba(0,0,0,.65),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden}

.fx{outline:none;transition:box-shadow .18s,transform .18s,background .2s}

/* arriba */
#top{position:fixed;right:34px;top:30px;padding:10px 22px 10px 10px;border-radius:28px;display:flex;gap:15px;align-items:center;animation:tp .55s .1s var(--sprg) both;z-index:3;min-width:350px;max-width:560px}

.tx .k,.tx b,.tt span{text-shadow:0 1px 8px rgba(0,0,0,.6)}
.tcv{width:58px;height:58px;border-radius:17px;flex:none;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));display:grid;place-items:center;color:#c9c9d2;box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.16);animation:pop .7s .25s var(--sprg) both;position:relative}

.tx{min-width:0;flex:1;position:relative}.tx .k{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#c9c9d2}

.tt{text-align:right;padding-left:16px;border-left:1px solid rgba(255,255,255,.14);position:relative}.tt span{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}.tt small{display:block;margin-top:1px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}

#dock{box-shadow:0 30px 90px rgba(0,0,0,.65),0 14px 70px rgba(var(--t,255,255,255),.16),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05);transition:box-shadow 1.2s ease;position:fixed;left:50%;bottom:50px;width:min(1280px,calc(100vw - 70px));height:104px;border-radius:34px;padding:0 24px;display:grid;grid-template-columns:minmax(220px,300px) 1fr auto;align-items:center;gap:22px;animation:dk .55s var(--sprg) both;transform:translate(-50%,0);z-index:4}

.eqs{display:flex;gap:2.5px;align-items:flex-end;height:18px;flex:none;opacity:0;transition:opacity .3s}.eqs.on{opacity:1}.eqs i{display:block;width:3.5px;height:30%;border-radius:2px;background:var(--sp)}.eqs.on i{animation:eq 1s ease-in-out infinite}.eqs i:nth-child(2){animation-delay:.2s!important}.eqs i:nth-child(3){animation-delay:.45s!important}
.ct{min-width:0}.cb{display:flex;justify-content:center;align-items:center;gap:14px}
.cbtn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:#d8d8de}.cbtn:hover{background:rgba(255,255,255,.1);color:#fff}.cbtn{transition:transform .22s var(--sprg),background .2s,color .2s}.cbtn:active{transform:scale(.88)}.cbtn:hover{transform:scale(1.08)}
.cbtn.on{color:var(--sp)}.cbtn.big{width:52px;height:52px;background:linear-gradient(180deg,var(--a2),var(--a));color:var(--on);box-shadow:0 8px 22px rgba(var(--rgb),.28),inset 0 1px 0 rgba(255,255,255,.7)}.cbtn.big:hover{background:linear-gradient(180deg,var(--a2),var(--a));color:var(--on);transform:scale(1.07)}
.pr{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}.pr span{width:36px}.pr span:last-child{text-align:left}.pr span:first-child{text-align:right}
.pg{flex:1;height:18px;display:flex;align-items:center;cursor:pointer;border-radius:9px;position:relative}.pg:before{content:"";position:absolute;left:0;right:0;height:5px;border-radius:5px;background:rgba(255,255,255,.14);top:6.5px}.pg i{position:absolute;left:0;top:6.5px;height:5px;border-radius:5px;background:linear-gradient(90deg,rgba(var(--t,255,255,255),.9),#fff);width:0;box-shadow:0 0 12px rgba(var(--t,255,255,255),.55)}.pg u{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;left:0;margin-left:-6px;opacity:0;transition:opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.5)}.pg:hover u,body.pad .pg.f u{opacity:1}
.ibr{display:flex;gap:10px}
.ib{width:50px;height:50px;border-radius:17px;border:0;background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer;color:#e6e6ec;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.ib{animation:cin .5s calc(var(--i,0)*55ms + .3s) var(--sprg) backwards;transition:transform .25s var(--sprg),background .2s,box-shadow .2s}.ib:hover{background:rgba(255,255,255,.16);transform:translateY(-4px) scale(1.06)}.ib:active{transform:scale(.92)}.ib.on:hover{background:linear-gradient(180deg,var(--a2),var(--a))}.ib.on{background:linear-gradient(180deg,var(--a2),var(--a));color:var(--on);box-shadow:0 8px 22px rgba(var(--rgb),.25),inset 0 1px 0 rgba(255,255,255,.7)}

/* tarjetas */

#card{pointer-events:auto;border-radius:30px;display:none;flex-direction:column;max-height:calc(100vh - 240px);margin-left:auto}
