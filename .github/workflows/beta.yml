name: Beta
on:
  push:
    branches: [beta]
    paths: ['main.js','preload.js','webskin.js','dl.js','src.js','bt.js','bt/**','index.html','package.json','icon.ico','icon.png','sagas/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bt:
    # Ayudante BitTorrent (libtorrent). Si falla, la beta se arma igual, sin BitTorrent.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-bt-${{ hashFiles('bt/vcpkg.json') }}
      - name: Compilar winteer-bt
        shell: bash
        run: |
          cmake -S bt -B bt/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build bt/build --config Release
          ls bt/build/Release
      - uses: actions/upload-artifact@v4
        with:
          name: winteer-bt
          path: bt/build/Release/winteer-bt.exe
  build:
    needs: bt
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Traer el ayudante BitTorrent (si se pudo compilar)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: winteer-bt
          path: bt/bin
      - run: mkdir -p bt/bin && ls bt/bin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Preparar 7-Zip (para descomprimir descargas)
        shell: bash
        run: |
          mkdir -p bin7z
          for f in 7z.exe 7z.dll; do cp "/c/Program Files/7-Zip/$f" bin7z/ 2>/dev/null || true; done
          if [ ! -f bin7z/7z.exe ]; then choco install 7zip -y --no-progress; for f in 7z.exe 7z.dll; do cp "/c/Program Files/7-Zip/$f" bin7z/; done; fi
          ls bin7z
      - name: Construir la beta (siempre una versión por encima de la oficial)
        run: |
          V=$(node -p "const v=require('./package.json').version.split('-')[0].split('.').map(Number);v[2]++;v.join('.')")
          echo "BETA_V=$V-beta.${{ github.run_number }}" >> $GITHUB_ENV
          npx electron-builder --win nsis --publish never -c.extraMetadata.version="$V-beta.${{ github.run_number }}"
          if [ -f dist/beta.yml ]; then mv dist/beta.yml dist/latest.yml; fi
          ls dist
      - name: Subir al release fijo "beta" (que la versión normal nunca mira)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view beta >/dev/null 2>&1 || gh release create beta --prerelease --title "beta" --notes "Canal de prueba" --target "${{ github.sha }}"
          gh release upload beta dist/latest.yml dist/setup-*.exe dist/setup-*.exe.blockmap --clobber
          KEEP=$(ls dist | grep -E '^(latest\.yml|setup-.*\.exe(\.blockmap)?)$' || true)
          for a in $(gh release view beta --json assets -q '.assets[].name'); do
            echo "$KEEP" | grep -qx "$a" || gh release delete-asset beta "$a" -y
          done
