name: Build
on:
  push:
    branches: [main]
    paths: ['main.js','preload.js','index.html','package.json','icon.ico','icon.png','sagas/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Preparar 7-Zip (para descomprimir descargas)
        shell: bash
        run: |
          mkdir -p bin7z
          for f in 7z.exe 7z.dll; do cp "/c/Program Files/7-Zip/$f" bin7z/ 2>/dev/null || true; done
          if [ ! -f bin7z/7z.exe ]; then choco install 7zip -y --no-progress; for f in 7z.exe 7z.dll; do cp "/c/Program Files/7-Zip/$f" bin7z/; done; fi
          ls bin7z
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
